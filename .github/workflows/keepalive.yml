name: Supabase keepalive

# Supabase 無料プランは7日間アクセスがないとプロジェクトが一時停止するため、
# 3日ごとに軽いクエリを投げて停止を防ぐ。
on:
  schedule:
    - cron: '0 18 */3 * *' # UTC 18:00 = 日本時間 3:00
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/households?select=id&limit=1" \
            -H "apikey: $KEY")
          echo "HTTP $code"
          test "$code" = "200"
